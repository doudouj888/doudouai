<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>카드키 조회</title>
  <meta name="description" content="카드키 상태를 여러 개 한 번에 조회할 수 있습니다." />
  <link rel="stylesheet" href="/ko/assets/style.css?v=20260328a" />
</head>
<body>
  <div class="query-page">
    <header class="page-header">
      <div class="page-header-content">
        <h1 class="page-title">카드키 조회</h1>
        <p class="page-subtitle">한 줄에 하나씩 입력하면 여러 개를 한 번에 조회할 수 있습니다.</p>
        <div class="header-actions">
          <a class="header-btn back-home-btn" href="/ko/">계정 충전</a>
        </div>
      </div>
    </header>

    <main class="query-container">
      <section class="query-card">
        <div class="query-input-panel">
          <label class="input-label" for="queryInput">카드키를 입력해 주세요. 여러 개일 경우 줄바꿈으로 구분해 주세요.</label>
          <textarea id="queryInput" class="modern-textarea query-textarea" placeholder="예시&#10;FMJWFQA06YTXXXX&#10;FMJWFQA06YTYYYY"></textarea>
          <div class="button-row query-actions">
            <button class="primary-button" id="queryButton" type="button">조회 시작</button>
            <button class="secondary-button" id="fillDemoButton" type="button">예시 채우기</button>
          </div>
        </div>

        <div class="query-result-panel">
          <div class="result-stats">
            <div class="result-stat">
              <span>전체 수량</span>
              <strong id="statTotal">0</strong>
            </div>
            <div class="result-stat">
              <span>미사용</span>
              <strong id="statUnused">0</strong>
            </div>
            <div class="result-stat">
              <span>사용됨</span>
              <strong id="statUsed">0</strong>
            </div>
            <div class="result-stat">
              <span>무효</span>
              <strong id="statInvalid">0</strong>
            </div>
          </div>

          <div class="copy-row">
            <button class="mini-button" data-copy-type="all" type="button">전체 복사</button>
            <button class="mini-button" data-copy-type="not_used" type="button">미사용 복사</button>
            <button class="mini-button" data-copy-type="used" type="button">사용됨 복사</button>
            <button class="mini-button" data-copy-type="invalid" type="button">무효 복사</button>
          </div>

          <div class="empty-state" id="emptyState">아직 조회 결과가 없습니다.</div>
          <div class="table-shell" id="tableWrap" hidden>
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>카드키</th>
                  <th>상태</th>
                  <th>사용 시간</th>
                  <th>사용 계정</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/ko/assets/query.js?v=20260328a"></script>
</body>
</html>
